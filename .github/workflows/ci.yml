# Runs the gate (npm run check, with the network blocked) on every PR and every push to main, and for
# release.yml before it builds.
# See CONTRIBUTING.md for what the gate checks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, cargo check and test (offline)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Every download happens here; the gate itself runs with the network denied.
      - run: npm ci
      - run: cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Compiles Tauri's dependencies (minutes when the cache is cold) outside the gate's budget.
      - name: Build Rust dependencies
        run: |
          cargo check --locked --offline --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --locked --offline --no-run --manifest-path apps/desktop/src-tauri/Cargo.toml

      - run: npm run check:offline
