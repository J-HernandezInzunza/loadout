# When a release is published (not a pre-release), point the Homebrew cask in J-HernandezInzunza/homebrew-tap
# at it, so `brew upgrade --cask loadout` finds it. See CONTRIBUTING.md for the release runbook.
name: Tap

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  cask:
    name: Update the Homebrew cask
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-latest
    environment: release
    steps:
      - name: Refuse to run without the tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::the release environment is missing TAP_TOKEN (contents write on J-HernandezInzunza/homebrew-tap)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download the .dmg and check it against its .sha256
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          dmg="Loadout_${version}_aarch64.dmg"
          mkdir -p download
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir download --pattern "$dmg" --pattern "$dmg.sha256"
          (cd download && shasum -a 256 -c "$dmg.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "download/$dmg" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: J-HernandezInzunza/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Point the cask at the release and push
        env:
          VERSION: ${{ steps.dmg.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          node tools/bump-cask.ts tap/Casks/loadout.rb "$VERSION" "$SHA256"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "loadout $VERSION"
          git push
