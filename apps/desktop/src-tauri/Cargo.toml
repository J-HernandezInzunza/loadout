[package]
name = "loadout"
version = "0.0.0"
description = "Loadout: distribute skills, agents and prompts"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "loadout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native"] }
tauri-plugin-http = "2"
