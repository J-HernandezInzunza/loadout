[package]
name = "loadout"
version = "0.5.0"
description = "Loadout: distribute skills, agents and prompts"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "loadout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native"] }
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
# The embedded WebDriver server flows drive the app through (M16.11, S17); only with the webdriver feature.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
# Debug builds for flows only: `tauri build --debug --features webdriver --config src-tauri/tauri.webdriver.conf.json`.
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
